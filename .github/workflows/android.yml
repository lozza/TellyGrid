name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TellyGrid
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew test assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TellyGrid-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TellyGrid-debug
          path: TellyGrid-debug.apk
          retention-days: 30
          if-no-files-found: error
